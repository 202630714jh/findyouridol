<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찾아돌 - 최애에 맞는 아이돌을 찾아드립니다</title>

<!-- Google Fonts Import for K-Pop Aesthetics -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&family=Outfit:wght@600;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   [K-POP CYBER STAGE DESIGN SYSTEM]
   - Primary Neon Pink: #ff007f
   - Neon Purple: #8a2be2
   - Electric Cyan: #00f0ff
   - Neon Lime/Yellow: #ffee00
   - Cyber Dark Background: #0b0716 / #130c25
   ========================================================================== */

:root {
  --bg-dark: #0b0716;
  --bg-card: rgba(22, 14, 42, 0.75);
  --bg-card-hover: rgba(35, 23, 66, 0.85);
  --bg-glass: rgba(255, 255, 255, 0.04);
  
  --neon-pink: #ff007f;
  --neon-purple: #8a2be2;
  --neon-cyan: #00f0ff;
  --neon-yellow: #ffee00;
  --neon-green: #00ff88;

  --text-main: #ffffff;
  --text-muted: #b1a5d4;
  --text-dim: #706296;

  --glow-pink: 0 0 20px rgba(255, 0, 127, 0.6), 0 0 40px rgba(255, 0, 127, 0.3);
  --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(0, 240, 255, 0.3);
  --glow-purple: 0 0 25px rgba(138, 43, 226, 0.5);
  --glow-gold: 0 0 25px rgba(255, 238, 0, 0.7);

  --gradient-main: linear-gradient(135deg, #ff007f 0%, #8a2be2 50%, #00f0ff 100%);
  --gradient-btn: linear-gradient(90deg, #ff007f 0%, #8a2be2 100%);
  --gradient-gold: linear-gradient(135deg, #ffee00 0%, #ff8800 100%);
  
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
}

/* --- Essential Functional Rule --- */
[hidden] { display: none !important; }

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: "Noto Sans KR", -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(255, 0, 127, 0.18) 0%, transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(138, 43, 226, 0.2) 0%, transparent 45%),
    radial-gradient(circle at 50% 85%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
  background-attachment: fixed;
}

/* Subtle Stage Grid Backdrop Pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  outline: none;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.4 !important;
  filter: grayscale(0.8);
}

img {
  max-width: 100%;
  display: block;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.app__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 24px;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-md);
  margin-bottom: 32px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.app__logo {
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Syne', 'Noto Sans KR', sans-serif;
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
  padding: 0;
}

.app__logo:hover {
  transform: scale(1.05);
}

/* Progress Bar */
.progress {
  flex: 1;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.progress__label {
  font-family: 'Outfit', sans-serif;
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--neon-cyan);
  letter-spacing: 0.1em;
  text-align: right;
  text-transform: uppercase;
}

.progress__track {
  height: 10px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  overflow: hidden;
  padding: 1px;
}

.progress__bar {
  height: 100%;
  width: var(--progress, 0%);
  background: var(--gradient-main);
  border-radius: 999px;
  box-shadow: 0 0 12px var(--neon-pink);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.app__main {
  flex: 1;
}

/* Hero Section */
.screen--main {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 0;
}

.hero {
  text-align: center;
  padding: 60px 24px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 0, 127, 0.25);
  border-radius: var(--radius-lg);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 0, 127, 0.05);
  position: relative;
  overflow: hidden;
  width: 100%;
}

.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
}

.hero__title {
  font-family: 'Syne', 'Noto Sans KR', sans-serif;
  font-size: clamp(3.5rem, 10vw, 6rem);
  font-weight: 900;
  color: #fff;
  line-height: 1.05;
  margin-bottom: 16px;
  text-shadow: 
    0 0 10px #fff,
    0 0 20px var(--neon-pink),
    0 0 40px var(--neon-pink),
    0 0 80px var(--neon-purple);
  animation: glowPulse 3s infinite alternate ease-in-out;
}

@keyframes glowPulse {
  0% { text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink); }
  100% { text-shadow: 0 0 15px #fff, 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-purple), 0 0 90px var(--neon-pink); }
}

.hero__subtitle {
  font-size: clamp(1.05rem, 3vw, 1.35rem);
  color: var(--text-muted);
  margin-bottom: 40px;
  font-weight: 400;
  letter-spacing: -0.01em;
}

.btn--start {
  font-family: 'Outfit', 'Noto Sans KR', sans-serif;
  font-size: 1.25rem;
  font-weight: 800;
  padding: 18px 48px;
  background: var(--gradient-btn);
  color: #fff;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--glow-pink);
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}

.btn--start:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 0 30px var(--neon-pink), 0 0 60px var(--neon-purple);
}

.btn--start:active {
  transform: translateY(1px) scale(0.98);
}

/* STEP Screen */
.screen--step {
  animation: fadeIn 0.35s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.step__badge {
  display: inline-block;
  font-family: 'Outfit', sans-serif;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.3);
  padding: 6px 16px;
  border-radius: 999px;
  margin-bottom: 12px;
  letter-spacing: 0.1em;
}

.step__title {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 800;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.step__desc {
  color: var(--text-muted);
  font-size: 1rem;
  margin-bottom: 4px;
}

.step__hint {
  color: var(--neon-yellow);
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 24px;
}

/* Option Grid */
.option-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin: 28px 0;
}

.option-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 20px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(138, 43, 226, 0.3);
  border-radius: var(--radius-md);
  text-align: left;
  position: relative;
  overflow: hidden;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.option-card:hover {
  border-color: var(--neon-cyan);
  transform: translateY(-4px);
  box-shadow: var(--glow-cyan);
  background: var(--bg-card-hover);
}

.option-card.is-selected {
  border-color: var(--neon-pink);
  background: linear-gradient(145deg, rgba(255, 0, 127, 0.2) 0%, rgba(22, 14, 42, 0.9) 100%);
  box-shadow: var(--glow-pink);
  transform: translateY(-4px) scale(1.02);
}

.option-card.is-selected::after {
  content: '✓';
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  background: var(--neon-pink);
  color: #fff;
  font-size: 0.85rem;
  font-weight: 900;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px var(--neon-pink);
}

.option-card__icon {
  font-size: 2.2rem;
  margin-bottom: 4px;
  filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
}

.option-card__label {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
}

.option-card__desc {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.step__nav {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 32px;
}

/* Buttons */
.btn {
  font-family: 'Outfit', 'Noto Sans KR', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  padding: 12px 28px;
  border-radius: var(--radius-sm);
  transition: all 0.25s ease;
}

.btn--primary {
  background: var(--gradient-btn);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
}

.btn--primary:hover:not(:disabled) {
  box-shadow: var(--glow-pink);
  transform: translateY(-2px);
}

.btn--ghost {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn--ghost:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

.btn--danger {
  background: rgba(255, 0, 85, 0.15);
  color: #ff3366;
  border: 1px solid rgba(255, 0, 85, 0.4);
}

.btn--danger:hover {
  background: #ff0055;
  color: #fff;
  box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
}

.btn--sm {
  padding: 6px 14px;
  font-size: 0.85rem;
}

.btn--admin {
  background: rgba(0, 0, 0, 0.5);
  color: var(--text-dim);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 0.8rem;
  padding: 8px 16px;
  border-radius: 999px;
}

.btn--admin:hover {
  color: var(--neon-cyan);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
}

/* Loading Screen */
.loading {
  text-align: center;
  padding: 100px 20px;
}

.loading__spinner {
  width: 70px;
  height: 70px;
  margin: 0 auto 28px;
  border: 5px solid rgba(138, 43, 226, 0.2);
  border-top-color: var(--neon-pink);
  border-right-color: var(--neon-cyan);
  border-radius: 50%;
  animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
  box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading__text {
  font-family: 'Outfit', 'Noto Sans KR', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.01em;
  animation: pulseText 1.5s infinite alternate;
}

@keyframes pulseText {
  0% { opacity: 0.6; }
  100% { opacity: 1; text-shadow: 0 0 12px var(--neon-cyan); }
}

/* Result Screen */
.result__title {
  font-family: 'Syne', 'Noto Sans KR', sans-serif;
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 900;
  text-align: center;
  margin-bottom: 20px;
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.result__summary {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 32px;
}

.chip, .tag {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  background: rgba(138, 43, 226, 0.2);
  border: 1px solid rgba(138, 43, 226, 0.5);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  backdrop-filter: blur(8px);
}

.chip--concept { border-color: var(--neon-pink); color: #ff88cc; }
.chip--song { border-color: var(--neon-cyan); color: #88f0ff; }
.chip--look { border-color: var(--neon-yellow); color: #ffee88; }

/* 1st Place Card - Main VIP Stage */
.match-card--main {
  background: linear-gradient(135deg, rgba(35, 18, 60, 0.9) 0%, rgba(15, 8, 30, 0.95) 100%);
  border: 2px solid var(--neon-yellow);
  border-radius: var(--radius-lg);
  padding: 28px;
  display: flex;
  gap: 28px;
  box-shadow: var(--glow-gold), inset 0 0 20px rgba(255, 238, 0, 0.1);
  margin-bottom: 40px;
  position: relative;
  overflow: hidden;
}

.match-card--main::before {
  content: '★ 1ST PLACE BEST MATCH ★';
  position: absolute;
  top: 14px;
  right: -35px;
  transform: rotate(25deg);
  background: var(--gradient-gold);
  color: #000;
  font-family: 'Outfit', sans-serif;
  font-size: 0.65rem;
  font-weight: 900;
  padding: 4px 40px;
  box-shadow: 0 0 10px rgba(255, 238, 0, 0.8);
}

.match-card--main .match-card__media {
  flex: 0 0 220px;
  position: relative;
}

.match-card__image {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.match-card__rank {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 12px;
  background: rgba(0, 0, 0, 0.85);
  border: 1px solid var(--neon-yellow);
  color: var(--neon-yellow);
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
  font-weight: 900;
  border-radius: var(--radius-sm);
  box-shadow: 0 0 10px rgba(255, 238, 0, 0.5);
}

.match-card__badge {
  display: inline-block;
  font-family: 'Outfit', sans-serif;
  font-size: 0.75rem;
  font-weight: 900;
  color: #000;
  background: var(--neon-yellow);
  padding: 3px 10px;
  border-radius: 4px;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

.match-card__name {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 8px;
}

.match-card__percent-value {
  font-family: 'Outfit', sans-serif;
  font-size: 2.8rem;
  font-weight: 900;
  color: var(--neon-pink);
  text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
  line-height: 1;
}

.match-card__percent-label {
  font-size: 1rem;
  color: var(--text-muted);
}

.match-card__desc {
  color: var(--text-muted);
  margin: 12px 0 20px;
  font-size: 0.95rem;
  line-height: 1.6;
}

/* Match Breakdown Bars */
.breakdown {
  margin: 16px 0;
  background: rgba(0, 0, 0, 0.3);
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.breakdown__row {
  display: grid;
  grid-template-columns: 60px 1fr 45px;
  gap: 12px;
  align-items: center;
  margin: 8px 0;
  font-size: 0.85rem;
}

.breakdown__label {
  color: var(--text-muted);
  font-weight: 600;
}

.breakdown__track {
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  overflow: hidden;
}

.breakdown__fill {
  height: 100%;
  background: var(--gradient-main);
  border-radius: 999px;
  box-shadow: 0 0 10px var(--neon-pink);
}

.breakdown__value {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  color: var(--neon-cyan);
  text-align: right;
}

/* 2nd & 3rd Place Cards */
.result__sub-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text-main);
  margin: 36px 0 16px;
}

.result__sub {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.match-card--sub {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-md);
  padding: 20px;
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.match-card--sub:hover {
  border-color: var(--neon-cyan);
  transform: translateY(-4px);
  box-shadow: var(--glow-cyan);
}

.match-card--sub .match-card__media {
  margin-bottom: 16px;
  position: relative;
}

.match-card--sub .match-card__rank {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}

.match-card--sub .match-card__name {
  font-size: 1.4rem;
}

.match-card--sub .match-card__percent-value {
  font-size: 2rem;
  color: var(--neon-cyan);
}

.result__actions {
  margin-top: 40px;
  text-align: center;
}

/* Admin Panel & Modal */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(8px);
}

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(5, 2, 12, 0.85);
}

.modal__dialog {
  position: relative;
  background: #150d2a;
  border: 1px solid var(--neon-pink);
  box-shadow: var(--glow-pink);
  padding: 32px;
  border-radius: var(--radius-md);
  width: min(90vw, 400px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.modal__title {
  font-size: 1.4rem;
  font-weight: 800;
  color: #fff;
}

.modal__error, .admin__form-error {
  color: #ff3366;
  font-size: 0.85rem;
  min-height: 1.25em;
}

.form-field {
  display: block;
  margin-bottom: 16px;
}

.form-field__label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: inherit;
  font-size: 0.95rem;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
}

/* Admin Dashboard Screen */
.admin {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  padding: 32px;
}

.admin__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.admin__title {
  font-size: 1.8rem;
  font-weight: 800;
  color: #fff;
}

.admin__status {
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.admin__body {

</head>

<body>

    </div>

<script>
(() => {
'use strict';

/* ==========================================================================
   1. 설정 (CONFIG)
   ========================================================================== */
const CONFIG = {
  ADMIN_PASSWORD: '1234',              // ※ 클라이언트 코드에 노출되므로 "보안"이 아닌 "실수 방지" 용도입니다.
  STORAGE_KEY: 'chajadol:idols:v1',    // localStorage 키 (데이터 구조를 바꾸면 v2로 올릴 것)
  MATCHING_DELAY_MS: 1200,             // 결과 계산 연출 시간 (0으로 두면 즉시 표시)
  RANDOM_MIN: 10,                      // 랜덤 점수 범위
  RANDOM_MAX: 100,
  TOP_N: 3                             // 결과 노출 개수 (1위 메인 + 나머지 서브)
};

/* STEP 정의: 여기만 수정하면 화면·관리자 폼·매칭 알고리즘에 모두 반영됩니다.
   - key       : 데이터 저장 키 (idol.scores[key][optionId])
   - weight    : 최종 일치율 계산 시 가중치 (기본 1:1:1)
   - maxSelect : 1이면 단일 선택, 2 이상이면 복수 선택(가득 차면 가장 오래된 선택이 해제됨) */
const STEPS = [
  {
    key: 'concept', label: '컨셉', weight: 1, maxSelect: 1,
    title: '원하는 아이돌 컨셉을 골라주세요',
    desc: '무대와 콘셉트에서 어떤 모습이 끌리나요?',
    options: [
      { id: 'lovely',   icon: '🍓', label: '큐티·러블리',     desc: '사랑스럽고 발랄한 매력' },
      { id: 'fresh',    icon: '🌊', label: '청량·상큼',       desc: '여름 같은 풋풋함' },
      { id: 'powerful', icon: '🔥', label: '파워풀·카리스마', desc: '무대를 압도하는 에너지' },
      { id: 'dark',     icon: '🌙', label: '다크·미스터리',   desc: '강렬하고 신비로운 세계관' },
      { id: 'retro',    icon: '📼', label: '레트로·힙',       desc: 'Y2K 감성의 트렌디함' }
    ]
  },
  {
    key: 'song', label: '노래', weight: 1, maxSelect: 1,
    title: '좋아하는 노래 스타일을 골라주세요',
    desc: '자주 듣게 되는 노래는 어떤 느낌인가요?',
    options: [
      { id: 'dance',  icon: '💃', label: '퍼포먼스 댄스', desc: '칼군무가 돋보이는 강렬한 곡' },
      { id: 'pop',    icon: '🎵', label: '밝은 팝',       desc: '중독성 있는 멜로디' },
      { id: 'hiphop', icon: '🎤', label: '힙합·랩',       desc: '그루브 넘치는 비트' },
      { id: 'rnb',    icon: '🎧', label: 'R&B·무드',      desc: '몽글몽글 감성적인 분위기' },
      { id: 'ballad', icon: '🎹', label: '발라드',        desc: '서정적인 보컬 중심의 곡' }
    ]
  },
  {
    key: 'look', label: '외모', weight: 1, maxSelect: 1,
    title: '원하는 이상형 외모/분위기를 골라주세요',
    desc: '첫인상이 끌리는 쪽은 어디인가요?',
    options: [
      { id: 'puppy',  icon: '🐶', label: '강아지상',     desc: '귀엽고 순한 인상' },
      { id: 'cat',    icon: '🐱', label: '고양이상',     desc: '시크하고 도도한 인상' },
      { id: 'warm',   icon: '☀️', label: '다정한 분위기', desc: '따뜻하고 편안한 느낌' },
      { id: 'sharp',  icon: '✨', label: '또렷한 이목구비', desc: '선명하고 화려한 느낌' },
      { id: 'dreamy', icon: '🌷', label: '몽환적 분위기', desc: '신비롭고 아련한 느낌' }
    ]
  }
];

/* 기본 샘플 데이터 (가상의 인물). 점수는 로드할 때마다 랜덤 생성됩니다. */
const SAMPLE_IDOLS = [
  { name: '하루', desc: '밝은 에너지로 분위기를 바꾸는 무대 위의 비타민.' },
  { name: '시안', desc: '차분한 카리스마와 깊은 눈빛이 매력적인 메인 보컬.' },
  { name: '이서', desc: '어떤 콘셉트도 자기 것으로 만드는 만능 퍼포머.' },
  { name: '노아', desc: '부드러운 음색과 다정한 미소가 돋보이는 멤버.' },
  { name: '리아', desc: '트렌디한 감각으로 시선을 사로잡는 비주얼 센터.' },
  { name: '도윤', desc: '리듬을 타는 랩과 강렬한 퍼포먼스가 강점.' },
  { name: '유나', desc: '청량한 목소리로 여름을 노래하는 막내.' },
  { name: '카이', desc: '몽환적인 분위기와 독특한 표현력을 가진 아티스트.' }
];

/* ==========================================================================
   2. 유틸
   ========================================================================== */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const randomScore = () =>
  CONFIG.RANDOM_MIN + Math.floor(Math.random() * (CONFIG.RANDOM_MAX - CONFIG.RANDOM_MIN + 1));
const genId = () => 'idol-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const findOption = (step, id) => step.options.find(o => o.id === id);

/* DOM 생성 헬퍼: innerHTML을 쓰지 않아 관리자 입력값이 그대로 텍스트로만 렌더링됩니다(XSS 방지). */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

const escapeXml = s => s.replace(/[<>&"']/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[ch]));

/* 이미지 URL이 없거나 로드 실패 시 사용하는 기본 이미지 (data URI) */
function placeholderImage(name) {
  const initial = escapeXml(((name || '?').trim().charAt(0)) || '?');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">` +
    `<rect width="400" height="500" fill="#130c25"/>` +
    `<circle cx="200" cy="250" r="120" fill="rgba(255,0,127,0.15)"/>` +
    `<text x="200" y="295" font-size="140" text-anchor="middle" fill="#ff007f" font-family="sans-serif" font-weight="900">${initial}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function buildImage(idol, className) {
  const fallback = placeholderImage(idol.name);
  const img = el('img', { class: className, alt: `${idol.name} 대표 이미지`, loading: 'lazy', referrerpolicy: 'no-referrer' });
  img.addEventListener('error', () => { if (img.src !== fallback) img.src = fallback; });
  img.src = idol.image || fallback;
  return img;
}

/* ==========================================================================
   3. 데이터 계층 (localStorage)
   ========================================================================== */
/* 아이돌 데이터 스키마:
   { id, name, image, desc, scores: { concept:{lovely:0~100,...}, song:{...}, look:{...} } } */
function normalizeIdol(raw) {
  if (!raw || typeof raw !== 'object' || !String(raw.name || '').trim()) return null;
  const scores = {};
  for (const step of STEPS) {
    scores[step.key] = {};
    for (const opt of step.options) {
      const src = raw.scores && raw.scores[step.key] ? raw.scores[step.key][opt.id] : undefined;
      const n = (src === undefined || src === null || src === '') ? NaN : Number(src);
      // 값이 비어 있거나 숫자가 아니면 랜덤 점수로 채움
      scores[step.key][opt.id] = Number.isFinite(n) ? clamp(Math.round(n), 0, 100) : randomScore();
    }
  }
  return {
    id: raw.id || genId(),
    name: String(raw.name).trim(),
    image: String(raw.image || '').trim(),
    desc: String(raw.desc || '').trim(),
    scores
  };
}

const Store = {
  /* 저장된 데이터가 없으면 null, 있으면 배열(빈 배열 포함) 반환 */
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      if (raw === null) return null;
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      return arr.map(normalizeIdol).filter(Boolean);
    } catch (e) { return null; }
  },
  save(list) {
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  },
  clear() {
    try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* noop */ }
  }
};

function createDefaultIdols() {
  return SAMPLE_IDOLS.map((s, i) => normalizeIdol({ id: 'sample-' + (i + 1), name: s.name, desc: s.desc, image: '' }));
}

/* ==========================================================================
   4. 앱 상태
   ========================================================================== */
const state = {
  screen: 'main',
  stepIndex: 0,
  selections: {},        // { concept: ['fresh'], song: [...], look: [...] }
  idols: [],
  isDefaultData: true,   // true: 샘플+랜덤 점수 (아직 localStorage에 저장 안 됨)
  storageError: false,
  isAdmin: false,
  isMatching: false,
  matchTimer: null,
  editingId: null
};

function loadData() {
  const saved = Store.load();
  if (saved !== null) { state.idols = saved; state.isDefaultData = false; }
  else { state.idols = createDefaultIdols(); state.isDefaultData = true; }
}

function persist() {
  const ok = Store.save(state.idols);
  state.storageError = !ok;
  if (ok) state.isDefaultData = false;
  renderAdminStatus();
  return ok;
}

/* ==========================================================================
   5. 매칭 알고리즘
   --------------------------------------------------------------------------
   ① 각 STEP에서 사용자가 고른 태그들에 대해, 아이돌의 해당 태그 점수(0~100) 평균 = STEP 점수
   ② STEP 점수들의 가중 평균(weight) = 최종 일치율(Match Score %)
   ③ 일치율 내림차순 정렬, 동점이면 이름순
   ========================================================================== */
function calcMatch(idol, selections) {
  let weighted = 0;
  let weightSum = 0;
  const details = [];

  for (const step of STEPS) {
    const picked = selections[step.key] || [];
    if (!picked.length) continue;

    const tags = picked.map(id => ({
      id,
      label: (findOption(step, id) || {}).label || id,
      score: (idol.scores[step.key] && idol.scores[step.key][id]) || 0
    }));
    const stepScore = tags.reduce((sum, t) => sum + t.score, 0) / tags.length;

    weighted += stepScore * step.weight;
    weightSum += step.weight;
    details.push({ key: step.key, label: step.label, score: Math.round(stepScore), tags });
  }

  const raw = weightSum ? weighted / weightSum : 0;
  return { idol, raw, percent: Math.round(raw), details };
}

function computeResults() {
  return state.idols
    .map(idol => calcMatch(idol, state.selections))
    .sort((a, b) => (b.raw - a.raw) || a.idol.name.localeCompare(b.idol.name, 'ko'))
    .slice(0, CONFIG.TOP_N);
}

/* ==========================================================================
   6. 화면 전환 / 진행바
   ========================================================================== */
function showScreen(name) {
  state.screen = name;
  $$('.screen').forEach(s => {
    const active = s.dataset.screen === name;
    s.hidden = !active;
    s.classList.toggle('is-active', active);
  });
  updateProgress();
  window.scrollTo({ top: 0 });
}

function updateProgress() {
  const total = STEPS.length;
  const box = $('#progress');
  let pct = 0;
  let label = '';
  let visible = true;

  switch (state.screen) {
    case 'step':
      pct = ((state.stepIndex + 1) / (total + 1)) * 100;
      label = `STEP ${state.stepIndex + 1} / ${total}`;
      break;
    case 'loading':
      pct = ((total + 0.5) / (total + 1)) * 100;
      label = 'AI 매칭 중';
      break;
    case 'result':
      pct = 100;
      label = '매칭 완료';
      break;
    default:
      visible = false;
  }

  box.hidden = !visible;
  box.style.setProperty('--progress', pct + '%');
  box.setAttribute('aria-valuenow', String(Math.round(pct)));
  $('#progress-label').textContent = label;
}

/* ==========================================================================
   7. STEP 1~3 : 렌더링 & 선택 처리
   ========================================================================== */
function startFlow() {
  state.selections = {};
  goToStep(0);
  showScreen('step');
}

function goToStep(index) {
  state.stepIndex = index;
  renderStep();
  updateProgress();
}

function renderStep() {
  const step = STEPS[state.stepIndex];
  $('#step-badge').textContent = `STEP ${state.stepIndex + 1}`;
  $('#step-title').textContent = step.title;
  $('#step-desc').textContent = step.desc;
  $('#step-hint').textContent = step.maxSelect === 1
    ? '하나를 선택해주세요.'
    : `최대 ${step.maxSelect}개까지 선택할 수 있어요.`;

  $('#option-grid').replaceChildren(...step.options.map(opt =>
    el('button', {
      type: 'button',
      class: 'option-card',
      'aria-pressed': 'false',
      dataset: { option: opt.id },
      onClick: () => toggleOption(step, opt.id)
    }, [
      el('span', { class: 'option-card__icon', 'aria-hidden': 'true', text: opt.icon }),
      el('span', { class: 'option-card__label', text: opt.label }),
      el('span', { class: 'option-card__desc', text: opt.desc })
    ])
  ));

  $('#btn-next').textContent = state.stepIndex === STEPS.length - 1 ? '결과 보기' : '다음';
  refreshSelectionUI();
}

function toggleOption(step, optionId) {
  let picked = (state.selections[step.key] || []).slice();
  const idx = picked.indexOf(optionId);

  if (idx >= 0) {
    picked.splice(idx, 1);                          // 다시 누르면 해제
  } else if (step.maxSelect === 1) {
    picked = [optionId];                            // 단일 선택: 교체
  } else {
    if (picked.length >= step.maxSelect) picked.shift();  // 가득 차면 가장 오래된 것 해제
    picked.push(optionId);
  }

  state.selections[step.key] = picked;
  refreshSelectionUI();
}

/* 선택 상태(.is-selected, aria-pressed)와 '다음' 버튼 활성화 갱신 */
function refreshSelectionUI() {
  const step = STEPS[state.stepIndex];
  const picked = state.selections[step.key] || [];
  $$('#option-grid .option-card').forEach(btn => {
    const on = picked.includes(btn.dataset.option);
    btn.classList.toggle('is-selected', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  $('#btn-next').disabled = picked.length === 0;
}

function goNext() {
  const step = STEPS[state.stepIndex];
  if (!(state.selections[step.key] || []).length) return;
  if (state.stepIndex < STEPS.length - 1) goToStep(state.stepIndex + 1);
  else startMatching();
}

function goPrev() {
  if (state.stepIndex > 0) goToStep(state.stepIndex - 1);
  else showScreen('main');
}

/* ==========================================================================
   8. STEP 4 : 매칭 실행 & 결과 렌더링
   ========================================================================== */
function startMatching() {
  if (state.isMatching) return;
  state.isMatching = true;
  showScreen('loading');
  state.matchTimer = setTimeout(() => {
    state.matchTimer = null;
    state.isMatching = false;
    renderResults(computeResults());
    showScreen('result');
  }, CONFIG.MATCHING_DELAY_MS);
}

function renderResults(results) {
  // 선택 요약 칩
  $('#result-summary').replaceChildren(...STEPS.flatMap(step =>
    (state.selections[step.key] || []).map(id =>
      el('span', { class: `chip chip--${step.key}`, text: `${step.label}: ${(findOption(step, id) || {}).label || id}` })
    )
  ));

  const mainBox = $('#result-main');
  const subBox = $('#result-sub');
  const subTitle = $('#result-sub-title');
  mainBox.replaceChildren();
  subBox.replaceChildren();

  if (!results.length) {
    mainBox.append(el('p', { class: 'result__empty', text: '등록된 아이돌이 없어요. 관리자 모드에서 아이돌을 추가해주세요.' }));
    subTitle.hidden = true;
    return;
  }

  mainBox.append(buildMatchCard(results[0], 1, false));
  const subs = results.slice(1);
  subTitle.hidden = subs.length === 0;
  subs.forEach((r, i) => subBox.append(buildMatchCard(r, i + 2, true)));
}

function buildMatchCard(result, rank, compact) {
  const { idol, percent, details } = result;

  const body = el('div', { class: 'match-card__body' }, [
    compact ? null : el('span', { class: 'match-card__badge', text: 'BEST MATCH' }),
    el('h3', { class: 'match-card__name', text: idol.name }),
    el('p', { class: 'match-card__percent' }, [
      el('span', { class: 'match-card__percent-value', text: `${percent}%` }),
      el('span', { class: 'match-card__percent-label', text: ' 일치' })
    ]),
    el('p', { class: 'match-card__desc', text: idol.desc || '소개 문구가 아직 없어요.' }),
    compact ? null : buildBreakdown(details),
    compact ? null : el('div', { class: 'match-card__tags' },
      details.flatMap(d => d.tags.map(t => el('span', { class: 'tag', text: `${t.label} ${t.score}` }))))
  ]);

  return el('article', {
    class: `match-card ${compact ? 'match-card--sub' : 'match-card--main'} match-card--rank-${rank}`,
    dataset: { idolId: idol.id }
  }, [
    el('div', { class: 'match-card__media' }, [
      el('span', { class: 'match-card__rank', text: `${rank}위` }),
      buildImage(idol, 'match-card__image')
    ]),
    body
  ]);
}

function buildBreakdown(details) {
  return el('div', { class: 'breakdown' }, details.map(d =>
    el('div', { class: 'breakdown__row' }, [
      el('span', { class: 'breakdown__label', text: d.label }),
      el('div', { class: 'breakdown__track' }, [
        el('div', { class: 'breakdown__fill', style: `width:${d.score}%` })
      ]),
      el('span', { class: 'breakdown__value', text: `${d.score}%` })
    ])
  ));
}

/* 처음 상태로 리셋 (로고 클릭 / 다시 하기 / 관리자 나가기) */
function resetAll() {
  if (state.matchTimer) { clearTimeout(state.matchTimer); state.matchTimer = null; }
  state.isMatching = false;
  state.selections = {};
  state.stepIndex = 0;
  showScreen('main');
}

/* ==========================================================================
   9. 관리자 : 로그인 모달
   ========================================================================== */
function openLoginModal() {
  if (state.isAdmin) { enterAdmin(); return; }     // 이미 인증된 세션이면 바로 진입
  $('#login-form').reset();
  $('#login-error').textContent = '';
  $('#modal-login').hidden = false;
  setTimeout(() => $('#login-password').focus(), 0);
}

function closeLoginModal() {
  $('#modal-login').hidden = true;
}

function handleLogin(e) {
  e.preventDefault();
  if ($('#login-password').value === CONFIG.ADMIN_PASSWORD) {
    state.isAdmin = true;
    closeLoginModal();
    enterAdmin();
  } else {
    $('#login-error').textContent = '비밀번호가 올바르지 않아요.';
    $('#login-password').select();
  }
}

function enterAdmin() {
  if (state.matchTimer) { clearTimeout(state.matchTimer); state.matchTimer = null; state.isMatching = false; }
  renderAdmin();
  showScreen('admin');
}

function exitAdmin() {
  state.isAdmin = false;
  resetForm();
  resetAll();
}

/* ==========================================================================
   10. 관리자 : 아이돌 CRUD
   ========================================================================== */
/* STEPS 설정을 기반으로 점수 입력칸 자동 생성 (1회) */
function buildScoreInputs() {
  $('#score-groups').replaceChildren(...STEPS.map(step =>
    el('fieldset', { class: 'score-group' }, [
      el('legend', { class: 'score-group__title', text: `${step.label} 태그 점수 (0~100)` }),
      ...step.options.map(opt =>
        el('label', { class: 'score-field' }, [
          el('span', { class: 'score-field__label', text: opt.label }),
          el('input', {
            type: 'number', class: 'form-input score-input',
            min: '0', max: '100', step: '1', placeholder: '랜덤',
            dataset: { step: step.key, tag: opt.id }
          })
        ])
      )
    ])
  ));
}

function renderAdmin() {
  if (state.editingId && !state.idols.some(i => i.id === state.editingId)) resetForm();
  renderAdminStatus();
  renderAdminList();
}

function renderAdminStatus() {
  const msg = state.isDefaultData
    ? '현재 기본 샘플 데이터(랜덤 점수)로 동작 중이에요. 저장·수정·삭제하면 localStorage에 고정 저장돼요.'
    : `localStorage에 저장된 아이돌 ${state.idols.length}명을 사용 중이에요.`;
  $('#admin-status').textContent = msg + (state.storageError ? ' ⚠ 저장에 실패했어요. 브라우저 저장 공간을 확인해주세요.' : '');
}

function renderAdminList() {
  const list = $('#admin-list');
  if (!state.idols.length) {
    list.replaceChildren(el('li', { class: 'admin__empty', text: '등록된 아이돌이 없어요. "+ 새 아이돌"로 추가해주세요.' }));
    return;
  }
  list.replaceChildren(...state.idols.map(idol =>
    el('li', { class: 'admin__item' + (idol.id === state.editingId ? ' is-editing' : '') }, [
      buildImage(idol, 'admin__thumb'),
      el('span', { class: 'admin__item-name', text: idol.name }),
      el('button', { type: 'button', class: 'btn btn--ghost btn--sm', text: '수정', onClick: () => startEdit(idol.id) }),
      el('button', { type: 'button', class: 'btn btn--danger btn--sm', text: '삭제', onClick: () => deleteIdol(idol.id) })
    ])
  ));
}

function resetForm() {
  state.editingId = null;
  $('#admin-form').reset();
  $('#admin-form-title').textContent = '새 아이돌 추가';
  $('#admin-form-error').textContent = '';
  renderAdminList();
}

function startEdit(id) {
  const idol = state.idols.find(i => i.id === id);
  if (!idol) return;
  state.editingId = id;
  $('#admin-form-title').textContent = `아이돌 수정: ${idol.name}`;
  $('#admin-form-error').textContent = '';
  $('#field-name').value = idol.name;
  $('#field-image').value = idol.image;
  $('#field-desc').value = idol.desc;
  $$('.score-input').forEach(inp => {
    inp.value = idol.scores[inp.dataset.step][inp.dataset.tag];
  });
  renderAdminList();
  $('#admin-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function handleIdolSubmit(e) {
  e.preventDefault();
  const name = $('#field-name').value.trim();
  if (!name) {
    $('#admin-form-error').textContent = '이름을 입력해주세요.';
    $('#field-name').focus();
    return;
  }

  // 점수 수집: 비어 있는 칸은 undefined → normalizeIdol 에서 랜덤 점수로 채워짐
  const scores = {};
  $$('.score-input').forEach(inp => {
    const { step, tag } = inp.dataset;
    if (!scores[step]) scores[step] = {};
    scores[step][tag] = inp.value.trim() === '' ? undefined : inp.value;
  });

  const idol = normalizeIdol({
    id: state.editingId || genId(),
    name,
    image: $('#field-image').value,
    desc: $('#field-desc').value,
    scores
  });

  if (state.editingId) {
    state.idols = state.idols.map(i => (i.id === state.editingId ? idol : i));
  } else {
    state.idols = [...state.idols, idol];
  }

  persist();          // 즉시 localStorage 저장 (기본 샘플 상태였다면 현재 목록 전체가 고정 저장됨)
  resetForm();
}

function deleteIdol(id) {
  const idol = state.idols.find(i => i.id === id);
  if (!idol || !confirm(`"${idol.name}"을(를) 삭제할까요?`)) return;
  state.idols = state.idols.filter(i => i.id !== id);
  persist();
  if (state.editingId === id) resetForm(); else renderAdminList();
}

function resetToDefault() {
  if (!confirm('저장된 데이터를 지우고 기본 샘플(랜덤 점수)로 되돌릴까요?')) return;
  Store.clear();
  state.storageError = false;
  loadData();
  resetForm();
  renderAdmin();
}

function fillRandomScores() {
  $$('.score-input').forEach(inp => { inp.value = randomScore(); });
}

/* ==========================================================================
   11. 이벤트 바인딩 & 초기화
   ========================================================================== */
function bindEvents() {
  $('#btn-logo').addEventListener('click', resetAll);
  $('#btn-start').addEventListener('click', startFlow);
  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-next').addEventListener('click', goNext);
  $('#btn-retry').addEventListener('click', resetAll);

  // 관리자
  $('#btn-admin-open').addEventListener('click', openLoginModal);
  $('#login-form').addEventListener('submit', handleLogin);
  $('#btn-login-cancel').addEventListener('click', closeLoginModal);
  $('#modal-backdrop').addEventListener('click', closeLoginModal);
  $('#btn-admin-exit').addEventListener('click', exitAdmin);
  $('#btn-admin-new').addEventListener('click', resetForm);
  $('#btn-admin-reset').addEventListener('click', resetToDefault);
  $('#admin-form').addEventListener('submit', handleIdolSubmit);
  $('#btn-form-cancel').addEventListener('click', resetForm);
  $('#btn-random-fill').addEventListener('click', fillRandomScores);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#modal-login').hidden) closeLoginModal();
  });

  // 다른 탭에서 데이터가 바뀌면 동기화
  window.addEventListener('storage', e => {
    if (e.key !== null && e.key !== CONFIG.STORAGE_KEY) return;
    loadData();
    if (state.screen === 'admin') renderAdmin();
  });
}

function init() {
  buildScoreInputs();
  loadData();
  bindEvents();
  showScreen('main');
}

init();

// 디버깅/QA용 (콘솔에서 window.__chajadol.calcMatch(...) 등으로 확인 가능)
window.__chajadol = { state, STEPS, CONFIG, calcMatch, computeResults };
})();
</script>
