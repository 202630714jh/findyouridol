<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾아돌 - 나만의 최애 아이돌 찾기</title>
  <style>
    /* ==========================================
       1. Global & Reset Styles (파스텔 톤 테마)
       ========================================== */
    :root {
      --bg-color: #f7f3ff;
      --card-bg: #ffffff;
      --primary-color: #a78bfa;
      --primary-hover: #8b5cf6;
      --secondary-color: #f472b6;
      --text-main: #374151;
      --text-muted: #6b7280;
      --border-radius: 16px;
      --shadow: 0 10px 25px -5px rgba(167, 139, 250, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Header & Progress Bar */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1.logo {
      font-size: 1.8rem;
      color: var(--primary-hover);
      margin-bottom: 8px;
    }

    .progress-container {
      width: 100%;
      background-color: #e5e7eb;
      height: 8px;
      border-radius: 4px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      transition: width 0.4s ease;
    }

    /* Steps Page Controls */
    .step {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-title {
      font-size: 1.3rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .step-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    /* Option Grid / List */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      background: #f9fafb;
      border: 2px solid #f3f4f6;
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover {
      border-color: var(--primary-color);
      background-color: #f5f3ff;
      color: var(--primary-hover);
    }

    /* Idol Cards for Step 4 */
    .idol-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .idol-card {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .idol-card:hover {
      border-color: var(--secondary-color);
      transform: translateY(-4px);
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.2);
    }

    .idol-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 8px;
    }

    .idol-name {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .idol-group {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* STEP 5: Loading Animation */
    .loading-container {
      text-align: center;
      padding: 40px 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* STEP 5: Result Screen */
    .result-card {
      text-align: center;
      padding: 10px 0;
    }

    .result-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary-color);
      margin-bottom: 16px;
    }

    .result-match-rate {
      display: inline-block;
      background: #fdf2f8;
      color: var(--secondary-color);
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 1.6rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .result-comment {
      font-size: 1rem;
      line-height: 1.5;
      color: #4b5563;
      background: #f3f4f6;
      padding: 16px;
      border-radius: 12px;
      margin: 16px 0;
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="logo">✨ 찾아돌 ✨</h1>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </header>

    <!-- STEP 1: 컨셉 선택 -->
    <div class="step active" id="step1">
      <h2 class="step-title">STEP 1. 어떤 컨셉이 끌리시나요?</h2>
      <p class="step-desc">가장 선호하는 아이돌의 분위기를 선택해주세요.</p>
      <div class="options-grid" id="conceptOptions"></div>
    </div>

    <!-- STEP 2: 노래 스타일 선택 -->
    <div class="step" id="step2">
      <h2 class="step-title">STEP 2. 어떤 노래 스타일을 좋아하나요?</h2>
      <p class="step-desc">자주 듣는 플레이리스트 스타일에 가깝게 골라주세요.</p>
      <div class="options-grid" id="songOptions"></div>
    </div>

    <!-- STEP 3: 외모 선택 -->
    <div class="step" id="step3">
      <h2 class="step-title">STEP 3. 이상형 외모 스타일은?</h2>
      <p class="step-desc">첫눈에 끌리는 외모 특성을 골라주세요.</p>
      <div class="options-grid" id="lookOptions"></div>
    </div>

    <!-- STEP 4: 후보 추천 및 선택 -->
    <div class="step" id="step4">
      <h2 class="step-title">STEP 4. 취향에 맞는 후보들입니다!</h2>
      <p class="step-desc">아래 멤버들 중 가장 끌리는 최애를 1명 선택하세요.</p>
      <div class="idol-cards-grid" id="idolCandidates"></div>
    </div>

    <!-- STEP 5: 로딩 & 결과 -->
    <div class="step" id="step5">
      <!-- Loading UI -->
      <div class="loading-container" id="loadingUI">
        <div class="spinner"></div>
        <h3>AI 알고리즘이 당신의 취향을 분석 중입니다...</h3>
      </div>

      <!-- Result UI -->
      <div class="result-card" id="resultUI" style="display: none;">
        <div class="result-match-rate" id="matchRate">취향 일치도 98%</div>
        <div>
          <img src="" alt="최애 아이돌" class="result-img" id="resultImg">
        </div>
        <h2 class="result-title" id="resultName">아이돌 이름</h2>
        <div class="result-comment" id="resultComment">결과 설명 멘트</div>
        <button class="restart-btn" onclick="resetApp()">다시 테스트하기</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       2. Data Store (아이돌 DB 및 선택지 설정)
       ========================================== */
    const optionsData = {
      concepts: ["청량·시원", "걸크러시·하이틴", "몽환·아련", "다크·스포티", "유니크·키치"],
      songs: ["이지리스닝 (편안함)", "에너지틱·댄스", "감성·발라드", "힙합·트랩", "팝·R&B"],
      looks: ["강아지상", "고양이상", "토끼상", "여우/공룡상", "사슴/곰상"]
    };

    // 샘플 K-POP 아이돌 데이터베이스 (남/여 아이돌 10명)
    const idolsDB = [
      { id: 1, name: "카리나", group: "aespa", concept: "유니크·키치", song: "에너지틱·댄스", look: "고양이상", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" },
      { id: 2, name: "민지", group: "NewJeans", concept: "청량·시원", song: "이지리스닝 (편안함)", look: "강아지상", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" },
      { id: 3, name: "장원영", group: "IVE", concept: "걸크러시·하이틴", song: "팝·R&B", look: "토끼상", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150" },
      { id: 4, name: "윈터", group: "aespa", concept: "유니크·키치", song: "에너지틱·댄스", look: "강아지상", img: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150" },
      { id: 5, name: "설윤", group: "NMIXX", concept: "몽환·아련", song: "팝·R&B", look: "사슴/곰상", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" },
      { id: 6, name: "차은우", group: "ASTRO", concept: "청량·시원", song: "감성·발라드", look: "사슴/곰상", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" },
      { id: 7, name: "정국", group: "BTS", concept: "다크·스포티", song: "팝·R&B", look: "강아지상", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" },
      { id: 8, name: "현진", group: "Stray Kids", concept: "다크·스포티", song: "힙합·트랩", look: "여우/공룡상", img: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150" },
      { id: 9, name: "성한빈", group: "ZEROBASEONE", concept: "청량·시원", song: "이지리스닝 (편안함)", look: "cat", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150" },
      { id: 10, name: "연준", group: "TXT", concept: "걸크러시·하이틴", song: "힙합·트랩", look: "여우/공룡상", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150" }
    ];

    // 결과 멘트 템플릿
    const commentTemplates = [
      "운명적 만남! 당신이 꿈꾸던 이상형과 무대 위 매력이 200% 일치하는 최애입니다. 오늘부터 덕질 1일차를 선언하세요!",
      "취향 저격 완료! 당신이 고른 완벽한 음색과 외모 밸런스를 모두 갖춘 맞춤형 아이돌입니다. 무대 직캠을 확인해보세요!",
      "알고리즘도 놀란 극강의 케미스트리! 당신의 일상에 매일 새로운 에너지를 선사해 줄 단 하나의 아티스트입니다."
    ];

    /* ==========================================
       3. State & Logic Handler
       ========================================== */
    let currentStep = 1;
    let userSelections = { concept: "", song: "", look: "" };

    // 초기화 및 버튼 생성
    function init() {
      renderOptions('conceptOptions', optionsData.concepts, 'concept');
      renderOptions('songOptions', optionsData.songs, 'song');
      renderOptions('lookOptions', optionsData.looks, 'look');
      updateProgressBar();
    }

    function renderOptions(containerId, list, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      list.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${item}</span> <span>➔</span>`;
        btn.onclick = () => selectOption(type, item);
        container.appendChild(btn);
      });
    }

    function selectOption(type, value) {
      userSelections[type] = value;
      nextStep();
    }

    function nextStep() {
      document.getElementById(`step${currentStep}`).classList.remove('active');
      currentStep++;
      
      if (currentStep === 4) {
        calculateAndRenderCandidates();
      }
      
      document.getElementById(`step${currentStep}`).classList.add('active');
      updateProgressBar();
    }

    function updateProgressBar() {
      const progress = (currentStep / 5) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;
    }

    // 추천 후보 3~4명 선정 로직 (점수 가중치 계산)
    function calculateAndRenderCandidates() {
      const scoredIdols = idolsDB.map(idol => {
        let score = 0;
        if (idol.concept === userSelections.concept) score += 40;
        if (idol.song === userSelections.song) score += 30;
        if (idol.look === userSelections.look) score += 30;
        return { ...idol, score };
      });

      // 점수 내림차순 정렬 후 상위 4명 추출
      scoredIdols.sort((a, b) => b.score - a.score);
      const topCandidates = scoredIdols.slice(0, 4);

      const grid = document.getElementById('idolCandidates');
      grid.innerHTML = "";
      topCandidates.forEach(idol => {
        const card = document.createElement('div');
        card.className = 'idol-card';
        card.innerHTML = `
          <img src="${idol.img}" alt="${idol.name}">
          <div class="idol-name">${idol.name}</div>
          <div class="idol-group">${idol.group}</div>
        `;
        card.onclick = () => showFinalResult(idol);
        grid.appendChild(card);
      });
    }

    // 최종 결과 출력 (STEP 5)
    function showFinalResult(selectedIdol) {
      nextStep(); // STEP 5로 이동

      // 1.5초간 로딩 연출
      setTimeout(() => {
        document.getElementById('loadingUI').style.display = 'none';
        const resultUI = document.getElementById('resultUI');
        resultUI.style.display = 'block';

        // 계산된 일치도 (%) 및 데이터 적용
        const baseRate = selectedIdol.score > 0 ? 85 : 75;
        const matchRate = Math.min(99, baseRate + Math.floor(Math.random() * 11)); // 85~99%
        const randomComment = commentTemplates[Math.floor(Math.random() * commentTemplates.length)];

        document.getElementById('matchRate').innerText = `취향 일치도 ${matchRate}%`;
        document.getElementById('resultImg').src = selectedIdol.img;
        document.getElementById('resultName').innerText = `${selectedIdol.group} ${selectedIdol.name}`;
        document.getElementById('resultComment').innerText = `"${randomComment}"`;
      }, 1500);
    }

    function resetApp() {
      currentStep = 1;
      userSelections = { concept: "", song: "", look: "" };
      document.getElementById('resultUI').style.display = 'none';
      document.getElementById('loadingUI').style.display = 'block';
      
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step1').classList.add('active');
      updateProgressBar();
    }

    // 실행
    window.onload = init;
  </script>
</body>
</html>
